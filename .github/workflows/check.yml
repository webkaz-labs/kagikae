name: Check

# The single source of what CI runs; the steps below are that list. Called by ci.yml
# (push/PR) and by release.yml (before publishing a tag), so the release gate cannot
# drift from CI.
#
# It is a SUBSET of the local `mise run check`, not a mirror of it, and this comment
# claimed to mirror it until the gap was measured: the local gate also runs gofumpt and
# goimports (not plain gofmt), staticcheck, golangci-lint, shellcheck, build, the smoke
# selftest and the docs selftest. Anything only in the local gate is enforced on a
# developer's machine and nowhere else, and this repository has already paid for that:
# the test that ran the real `security` binary and wrote items into the operator's login
# keychain is recorded in docs/ROADMAP.md, which also notes it failed on linux and passed
# on darwin — a difference no single-environment gate can see. Further widening is filed
# in docs/ROADMAP.md; until then, do not describe the two as equivalent.
#
# Docs-check is here and its selftest is not, decided 2026-08-14, because they stopped
# costing the same thing. The check is bash plus one `go run` of a stdlib-only program
# over the tree — no python since the extractor was ported, no network beyond the module
# cache, and it writes nothing outside the checkout — so it needed no decision about
# caching or about what a runner may touch. Its selftest copies the tracked tree once per
# case and runs the whole check on each, which does.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

      - name: Test
        run: go test ./...

      - name: Module verify
        run: go mod verify

      - name: Docs check
        run: bash scripts/check-docs.sh
