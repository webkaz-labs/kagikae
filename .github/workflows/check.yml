name: Check

# Shared by ci.yml and release.yml. This workflow is a subset of the local
# mise run check; compare these steps with mise.toml for the current gap. The
# picker PTY split is in docs/VALIDATION.md § Picker PTY suite.
# Formatter behavior is owned by tools/devtools/shell/check-go-format.sh. Docs module-resolution
# constraints are set on their steps below. Further admission decisions live in
# docs/ROADMAP.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Completion tests invoke zsh. ubuntu-latest ships bash and not zsh.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # The picker PTY suite runs the built kae under zsh. The Node version is the
      # one mise.toml pins; setup-node cannot read mise.toml, so change both together.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: test/tui/package-lock.json

      - name: Vet
        run: go vet ./...

      - name: Format
        run: bash tools/devtools/shell/check-go-format.sh
        env:
          GOCLI_LINT_CACHE_DIR: ${{ runner.temp }}/formatter-cache

      - name: Test
        run: go test ./...

      # The same commands as the mise tui-e2e-setup and tui-e2e tasks
      # (docs/VALIDATION.md § Picker PTY suite).
      - name: Picker PTY suite
        working-directory: test/tui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # setup-go caches `go env GOCACHE` and does not export it; the harness's
          # build would otherwise use a cold $TMPDIR/kae-gocache.
          GOCACHE="$(go env GOCACHE)" node run.mjs

      # The missing-main control in docs/VALIDATION.md passes
      # go test and fails go build. Reuse Setup Go's cache to check linking too;
      # keep the executables in runner temp.
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/kae-build"
          go build -o "$RUNNER_TEMP/kae-build/" ./...

      - name: Module verify
        run: go mod verify

      - name: Docs check
        run: bash scripts/check-docs.sh
        env:
          # An empty module cache plus GOPROXY=off refuses module resolution
          # outside this checkout; it does not prohibit program socket access.
          GOPROXY: off
          GOMODCACHE: ${{ runner.temp }}/docs-check-modcache

      - name: Docs selftest
        run: bash scripts/check-docs-selftest.sh
        env:
          GOCACHE: ${{ runner.temp }}/docs-selftest-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-selftest-modcache
          GOPROXY: off

      # TestSignerCLIStatesSpecLibc with the release workflow's signer CLI
      # (docs/VALIDATION.md § Packslip consumer smoke). The digest is the linux-x64
      # archive's entry in action/release.json at release.yml's Packslip Action
      # pin, and the provenance policy is the one that Action's installer applies
      # (source and signer digest are that release.json's source_commit).
      # TestCheckWorkflowSignsWithReleaseSigner keeps PACKSLIP_VERSION equal to
      # signerPackslip, which TestReleaseWorkflowMatchesVerifier ties to the pin's
      # `# v1.6.0;` comment, and fixes every command below line by line.
      # github.token only reads public attestations; go test and packslip run
      # without it.
      - name: Signing test
        env:
          GH_TOKEN: ${{ github.token }}
          PACKSLIP_VERSION: 1.6.0
          PACKSLIP_SHA256: b57bc18667039138fd23ada4a6b650a6e1d8c4b8c3a6e3695dafc010f8e25537
          PACKSLIP_SOURCE_COMMIT: 37134cc0968448f4e926052ee412e198fb8d0c54
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/packslip"
          name="packslip-v${PACKSLIP_VERSION}-linux-x64"
          archive="$dir/$name.tar.xz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/jdx/packslip/releases/download/v${PACKSLIP_VERSION}/$name.tar.xz"
          echo "$PACKSLIP_SHA256  $archive" | sha256sum -c -
          # 1.6.0's provenance names this branch, not the tag (docs/RELEASE.md).
          # Three tries, 10 s apart, for a transient API or Sigstore failure.
          for attempt in 1 2 3; do
            if gh attestation verify "$archive" --repo jdx/packslip --source-ref refs/heads/release-plz --source-digest "$PACKSLIP_SOURCE_COMMIT" --signer-workflow jdx/packslip/.github/workflows/release.yml --signer-digest "$PACKSLIP_SOURCE_COMMIT" --deny-self-hosted-runners; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done
          tar -xJf "$archive" -C "$dir"
          env -u GH_TOKEN PACKSLIP_BIN="$dir/$name/packslip" go test -count=1 -v -run '^TestSignerCLIStatesSpecLibc$' ./scripts/releaseverify 2>&1 | tee "$dir/test.log"
          # go test exits 0 when the name matches nothing or the test skips.
          if ! grep -q -- '--- PASS: TestSignerCLIStatesSpecLibc ' "$dir/test.log"; then
            echo "TestSignerCLIStatesSpecLibc did not run and pass" >&2
            exit 1
          fi
