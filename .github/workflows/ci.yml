name: CI

# Run the shared check gate (check.yml) and the arm64 build/vet/test jobs
# (platforms.yml) on pushes to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
  platforms:
    uses: ./.github/workflows/platforms.yml
