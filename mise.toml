[tools]
go = "1.27.1"
node = "24.21.0"
goreleaser = "2.16.0"
shellcheck = "0.11.0"

[tasks.test]
description = "Run Go tests, internal/cmd sharded across processes, with cache and wall time"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} /usr/bin/time -p go run ./scripts/testshard"

[tasks.test-fresh]
hide = true
description = "Run Go tests without cache and show wall time"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} /usr/bin/time -p go run ./scripts/testshard -count1"

[tasks.vet]
hide = true
description = "Run Go vet"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} go vet ./..."

[tasks.fmt-check]
hide = true
description = "Check Go formatting and import grouping"
run = "bash tools/devtools/shell/check-go-format.sh"

[tasks.staticcheck]
hide = true
description = "Run bug-class Staticcheck analyzers"
run = """
set -eu
cache_name=kae-lint cache_override=${GOCLI_LINT_CACHE_DIR:-}
. tools/devtools/shell/cache-root.sh
mkdir -p "$cache_root"
export GOPATH="$cache_root/gopath"
export GOCACHE="$cache_root/gocache"
export GOMODCACHE="$cache_root/gomodcache"
export STATICCHECK_CACHE="$cache_root/staticcheck"
go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 '-checks=SA*' ./...
"""

[tasks.golangci-lint]
hide = true
description = "Run curated golangci-lint checks"
run = """
set -eu
cache_name=kae-lint cache_override=${GOCLI_LINT_CACHE_DIR:-}
. tools/devtools/shell/cache-root.sh
mkdir -p "$cache_root"
export GOPATH="$cache_root/gopath"
export GOCACHE="$cache_root/gocache"
export GOMODCACHE="$cache_root/gomodcache"
export GOLANGCI_LINT_CACHE="$cache_root/golangci-lint"
go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
"""

[tasks.shellcheck]
hide = true
description = "Run ShellCheck on repository shell scripts"
run = """
set -eu
if [ ! -d scripts ]; then
  printf 'shellcheck: no scripts directory\\n'
  exit 0
fi
files="$(find scripts tools/devtools -type f -name '*.sh' -print)"
if [ -z "$files" ]; then
  printf 'shellcheck: no shell scripts\\n'
  exit 0
fi
shellcheck -x -P SCRIPTDIR -S warning $files
"""

[tasks.lint]
description = "Run low-noise local lint checks"
depends = ["fmt-check", "staticcheck", "golangci-lint", "shellcheck"]

[tasks.mod-verify]
hide = true
description = "Verify downloaded Go modules"
run = "go mod verify"

[tasks.build]
description = "Build packages"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} go build ./..."

[tasks.tui-e2e-setup]
hide = true
description = "Install the PTY suite's pinned dependencies from the lockfile when node_modules is missing or was installed from another lockfile"
dir = "test/tui"
run = "cmp -s package-lock.json node_modules/.kae-lock-stamp || { npm ci --ignore-scripts --no-audit --no-fund && cp package-lock.json node_modules/.kae-lock-stamp; }"

[tasks.tui-e2e]
description = "Run every picker PTY scenario against the built binary (docs/VALIDATION.md § Picker PTY suite)"
depends = ["tui-e2e-setup"]
dir = "test/tui"
run = "node run.mjs"

[tasks.tui-e2e-fast]
description = "Run the PTY scenarios tagged fast, one journey selected from the full suite"
depends = ["tui-e2e-setup"]
dir = "test/tui"
run = "node run.mjs --tag fast"

[tasks.smoke-selftest]
hide = true
description = "Check the guards in scripts/smoke-run.sh (no kae build, no network)"
run = "bash scripts/smoke-run-selftest.sh"

[tasks.smoke-selftest-mutations-fast]
hide = true
description = "Make four bounded historical smoke-run defects trip their guards"
run = "bash scripts/smoke-run-mutations.sh fast"

[tasks.smoke-selftest-mutations]
hide = true
description = "Make one bounded mutation trip each current smoke-run guard"
run = "bash scripts/smoke-run-mutations.sh full"

[tasks.harvest-smoke-selftest]
hide = true
description = "Prove the Harvesting smoke's four snap-consumer controls reject an empty reader"
run = "bash scripts/harvest-smoke-selftest.sh"

[tasks.release-evidence]
description = "Run the release-only mutation evidence for smoke guards and credential harvesting"
depends = ["smoke-selftest-mutations", "harvest-smoke-selftest"]

[tasks.naming-agreement]
description = "Compare production Claude credential write addressing with a reviewed upstream binary's shim reads"
run = [
  "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} go test -count=1 ./scripts/namingagreement",
  "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} go run ./scripts/namingagreement verify",
]

[tasks.release-verify]
description = "Verify an explicit published vX.Y.Z tag, provenance and isolated installer"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} go run ./scripts/releaseverify"

[tasks.release-smoke]
description = "Run saved completion and per-account store smoke checks serially"
run = """
bash scripts/smoke-run.sh '## Shell completion for'
bash scripts/smoke-run.sh '## Switching a per-account credential store'
"""

[tasks.docs-check]
description = "Reject a broken markdown link, a section citation naming a section its target declares nowhere, a docs/ file the Documentation Map omits, or a root document that is missing, empty or not a regular file"
run = "bash scripts/check-docs.sh"

[tasks.docs-check-selftest]
hide = true
description = "Check that scripts/check-docs.sh still detects what it exists to detect"
run = "bash scripts/check-docs-selftest.sh"

[tasks.check]
description = "Run the standard local validation suite"
depends = ["lint", "test", "vet", "mod-verify", "build", "smoke-selftest", "smoke-selftest-mutations-fast", "docs-check", "docs-check-selftest", "tui-e2e-fast"]

# Deliberately not a dependency of `check`. What a report does and does not mean is
# tools/devtools/cmd/docscan/main.go's header, which is the one copy of it.
[tasks.docs-scan]
description = "Report prose two documents carry twice, anchored on declared identifiers"
run = "go run ./tools/devtools/cmd/docscan -glossary docs/CONTEXT.md -glossary-sections 'Surface terms,Mechanism terms'"

[tasks.vuln]
hide = true
description = "Run Go vulnerability audit"
run = """
set -eu
cache_name=kae-audit cache_override=${GOCLI_AUDIT_CACHE_DIR:-}
. tools/devtools/shell/cache-root.sh
mkdir -p "$cache_root"
export GOPATH="$cache_root/gopath"
export GOCACHE="$cache_root/gocache"
export GOMODCACHE="$cache_root/gomodcache"
go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
"""

[tasks.fingerprint]
hide = true
description = "Count the upstream literals kae depends on against the installed tools"
# -count=1 defeats the test cache: a cached pass would report that today's installed
# tools still agree with the table when it never opened them.
run = "KAE_FINGERPRINT=1 go test ./internal/adapter/ -run TestUpstreamLiteralFingerprints -count=1 -v"

[tasks.audit]
description = "Run slower release or scheduled audit checks"
depends = ["vuln", "fingerprint"]

[tasks.goreleaser-check]
description = "Validate GoReleaser release configuration"
run = "goreleaser check"

[tasks.goreleaser-snapshot]
description = "Build local GoReleaser snapshot archives without publishing"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/kae-gocache} goreleaser release --snapshot --clean --skip=publish"

[tasks.install]
description = "Build and install kae into ~/.local/bin for real-machine use"
run = "bash scripts/install-local.sh"
